# The builds a fresh install is allowed to run. Without them pnpm stops and
# tells the person to run `pnpm approve-builds` — in a directory they are not
# in, at the end of an install that scrolled past. A scaffold should install
# and be ready.
#
# msgpackr-extract is a native accelerator the wire's msgpack uses. esbuild is
# vite's.
allowBuilds:
  esbuild: true
  msgpackr-extract: true

# pnpm 11 holds a version back for a day after it is published
# (`minimumReleaseAge`), and quietly resolves an older one meanwhile. The
# method's own families move by betas that a scaffold installs minutes after
# they are published, so they are exempt. Remove each as its line releases.
minimumReleaseAgeExclude:
  - "@epure/*"
  - "@lapa/*"
  - tilia
  - "@tilia/*"
